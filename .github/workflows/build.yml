name: Build Helium (CPU Temperature)

# 触发方式：
#   1) push 到 main 自动构建
#   2) 在仓库 Actions 页面点 "Run workflow" 手动触发
#
# 注意：macos-13 镜像已于 2025-12-04 退役不可再用，这里用 macos-15（Apple Silicon）。
# 仓库根目录就是 Helium 源码树（Makefile/ipabuild.sh/src/layout 在此）。
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # 创建 Release 需要

    steps:
      - name: Show toolchain info
        run: |
          xcodebuild -version || true
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Arch: $(uname -m)"

      - name: Checkout patched Helium
        uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Set THEOS
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      # Helium 依赖 BackBoardServices / GraphicsServices / IOKit / SpringBoardServices
      # 四个私有框架，Xcode 自带 SDK 里没有，链接会报 "framework not found"。
      # 这里从 theos/sdks 只取这四个框架的 stub（.tbd，纯文本、与 Swift 无关），
      # 放进 private-frameworks/，再由 Makefile 的 -F 交给链接器。
      # 只稀疏检出这几个目录，不下载整个 SDK（否则数 GB，且旧 SDK 的 SwiftUI
      # 是 Swift 5.8 构建的，无法被 Xcode 16 的 Swift 6 使用）。
      - name: Fetch private framework stubs
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git sdk-stub
          cd sdk-stub
          git sparse-checkout set \
            iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/BackBoardServices.framework \
            iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/GraphicsServices.framework \
            iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/SpringBoardServices.framework \
            iPhoneOS16.5.sdk/System/Library/Frameworks/IOKit.framework
          cd ..
          mkdir -p private-frameworks
          cp -R sdk-stub/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/*.framework \
                private-frameworks/ 2>/dev/null || true
          cp -R sdk-stub/iPhoneOS16.5.sdk/System/Library/Frameworks/IOKit.framework \
                private-frameworks/ 2>/dev/null || true
          echo "---- private-frameworks 内容 ----"
          ls private-frameworks
          find private-frameworks -name "*.tbd" | sed 's/^/  /'

      # 用 Xcode 自带的 iOS SDK 编译（其 SwiftUI 与本机 Swift 版本匹配）。
      # Makefile 默认写死 16.5，与本机会话不一致会让 Theos 找不到 SDK，这里对齐。
      - name: Align SDK version in Makefile
        run: |
          HOST_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          TARGET_SDK="$(sed -n 's/^TARGET[[:space:]]*:=[^:]*:[^:]*:\([0-9.]*\):.*/\1/p' Makefile | head -1)"
          echo "本机 SDK = $HOST_SDK / Makefile SDK = $TARGET_SDK"
          if [ -n "$TARGET_SDK" ] && [ "$TARGET_SDK" != "$HOST_SDK" ]; then
            sed -i '' "s/^\(TARGET[[:space:]]*:=[^:]*:[^:]*:\)${TARGET_SDK}:/\1${HOST_SDK}:/" Makefile
            echo "已改写为: $(grep -m1 '^TARGET' Makefile)"
          else
            echo "版本一致，无需改动"
          fi

      - name: Install ldid
        run: brew install ldid

      # 用 `bash` 调用而不是 `./`：Git Data API 推送不保留可执行位，
      # `./ipabuild.sh` 会直接 Permission denied。仓库里那一位已经补回 100755，
      # 但调用方式不依赖它更稳。
      - name: Build tipa
        run: bash ipabuild.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statusbar.ipa
          path: build/Statusbar.ipa
          if-no-files-found: error

      # 发布到 Release：公开仓库的安装包可直接下载，无需登录、无鉴权。
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: statusbar-${{ github.run_number }}
          name: Statusbar 0.30 (build ${{ github.run_number }})
          body: |
            基于 Helium 改版。应用名改为 Statusbar，版本从 0.01 起（本次 0.30）。

            界面：只有「首页 / 自定义」两页，首页右上角直接显示版本号（无齿轮/设置入口）。
            部件：原有 9 个 + CPU温度 / CPU占用 / CPU频率 / 蜂窝信号（RSRP）。

            本次改动（0.30：修复「启用 HUD 部件不显示」的真正根因）：

              · 0.29 的诊断日志给出了决定性证据：渲染链每一秒都在把正确的文本
                写进遮罩（hidden 状态全对、内容正确、缓存正常），但屏幕上什么
                都没有 —— 直到手动调一次设置。结合 maskView 的机制，结论是
                0.26 的「只画可见路径」删掉了一个关键副作用：0.25 每次都写那个
                隐藏的 label，写入触发的全树布局正是遮罩内容（maskLabel 作为
                backdropView 的 maskView，**不在视图层级里**）被显示管线处理的
                时机。删掉它之后遮罩内容从不渲染 —— 这就是「不显示、调一次
                设置才出现」的全部原因。

              · 0.30 的修复：恢复 0.25 的双写（hidden 的 label 也要写，它触发
                的布局是显示链的一环），同时对遮罩层显式 displayIfNeeded 作为
                第二重保险；0.26 引入的内容缓存保留（稳态里静的部件仍不重复
                排版）。启动到出画的延迟反而比 0.25 更短 —— reload 完立即画
                首帧，不等第一个 tick。

              · 0.26 起的其他性能优化全部保留：按 set 合并定时器、电池信息
                缓存、CPU 温度后台采样、频率探针「有人看才测」。

              · 0.29 的移除描边、0.28 的压缩滤镜崩溃修复保持不变。诊断日志
                （helium_hud_debug.log）先保留一版，确认修复后再拔。

              · 移除「文字描边」：真机观感不佳（可见度不高），按反馈整段删掉 ——
                设置项、渲染逻辑、文案全部移除。关掉自适应取色后文字看不见的话，
                直接换个字色即可。

              · 启动显示兜底：「启用 HUD 后部件要手动调一次设置才出现」在 0.28 的
                同步 reload 之后仍然存在，根因还没定位到。0.29 在启动后 1s / 3s
                各补跑一次幂等的 reload（就是「手动调设置」触发的那条路径），先用
                笨办法保证「开 HUD 就有显示」。

              · 诊断日志：把启动、reload、定时器建立、每次渲染写入的全部决策点按
                时间轴写到
                /var/mobile/Library/Preferences/helium_hud_debug.log
                （追加写，Filza 可直接查看）。复现一次「不显示」后把这份文件发回
                来，就能对出第一次 reload 与「调设置的那次」差在哪。

              · 0.28 的崩溃修复（压缩滤镜的 inputKeys）保持不变；0.28 真机确认
                打开压缩滤镜不再崩溃。

              · 修复启动崩溃 —— 部件全部消失的直接原因。0.27 的压缩滤镜在可用性
                检查里直接调用了 CAFilter 的私有方法 `inputKeys`，真机（iOS 16.5）
                上它根本不响应这个方法：unrecognized selector 直接把常驻 HUD 进程
                杀掉。这就是「开启压缩滤镜后完全无法显示」的原因。现在可用性检查
                全部改用对任何对象都安全的 `respondsToSelector:`，并且整条压缩路径
                包进 @try/@catch：任何一步不符合预期（类不在 / 方法不响应 / 键不
                认识）都安静退回 4 趟滤镜，绝不再让进程死掉。

              · 修复「启用 HUD 后部件一直不显示、手动改一次设置才出现」：启动时的
                初始化 reload 原来靠 notify_post 异步投递，三步初始化（hidden 归位 /
                定时器建好 / 约束挂上）可能晚于第一个渲染 tick 才跑。现在
                viewDidLoad 里同步跑掉这一次，notify_post 保留给设置变更用。另给
                performReload 加了视图未建好的防御。

            0.27 的内容（自适应取色的旋钮与描边兜底，机制说明仍然成立）：

              · 先纠正一个长期被误解的地方：设置里的 Adaptive Color（自适应颜色）**不是**
                给部件加背景色，而是让**文字颜色自动与背后内容相反**。它靠
                `AnyBackdropView`（`CABackdropLayer`）把 HUD 背后的真实画面采样进来，
                经过「亮度 −28.5% → 对比度 1000× → 去饱和 → 反相」压成纯黑/纯白再翻
                过来，于是填充色永远和背景相反。所以它**同时**是可读性的来源，也是
                HUD 上最贵的一项：`CABackdropLayer` 每一帧都要重新采样，只要底下有东西
                在动（滚动、视频、动画）就一直在重新过滤。

              · 新增「文字描边」（Text Outline，默认开）：关掉自适应取色之后，文字颜色
                由你自己挑，可能正好落在背景上 —— 白字白底就彻底看不见了。描边是这条
                路径的兜底：填充与描边互为反色，任何背景上至少有一个是显眼的。描边色
                按**亮度**在纯黑/纯白之间二选一，而不是做分量取反 —— 分量取反在中间灰
                上会得到它自己（0.5 → 0.5），等于没描边，而那恰好是最需要兜底的一档。
                宽度可调（字号百分比，0.5–8）。只在「关掉自适应」那条路径上生效；自适
                应那条路本身已经把背后压成黑白再翻过来，加描边纯属白花钱。

              · 新增「自适应模糊半径」（Adaptive Blur Radius，0–50，默认 50）：原来写死
                50。模糊只决定取色决定在空间上有多平滑，**与可读性无关**，所以降它（直
                到 0）只省钱、不伤可读性。0 是完全跳过模糊，最省的一档。

              · 新增实验开关「压缩滤镜」（Compressed Filters，默认关）：把自适应取色背后
                的 4 趟全分辨率颜色滤镜压成 1 趟 `kCAFilterColorMatrix`。矩阵是那 4 趟算
                术的精确折叠（1、2 合并成一次仿射 `x → 1000x − 784.5`，再与 3、4 合并；
                亮度权重之和为 1，所以常数项不会被放大），但少了「每趟之间夹一次
                clamp」这一步 —— 于是输出从 8 级灰（三通道各自 0/1，亮度只有 2³ 种取值）
                变成纯黑白两档：**反差更大、层次更少**。省下来的是每帧 3 个全分辨率
                pass，不是一次性的。打开对比一下，不喜欢就关掉。

              · 仍然没动的两处：频率探针的 5 秒节流（见下），以及自适应取色那条路径上
                `backdropView` 的尺寸 —— 它的 frame 被引擎强制等于整个部件矩形，而滤镜
                是按面积跑的，所以等于为字形那一小块付了整块矩形的钱。这是上游 Helium
                就有的行为（已与上游源码逐行对照），不是本 fork 引入的。

            0.26（渲染路径上的开销）：

              起因是「开了 HUD 之后明显发卡」。查下来不是某一处特别慢，而是**每个
              tick 都在渲染路径（主线程）上做几件本来不必做的事**，叠在一起。

              · 一个 set 的部件共用一个定时器，不再是每个部件一个。`updateInterval`
                本来就是 set 级属性，一个 set 里的部件共享同一个间隔 —— 那它们就没
                理由各占一个 `dispatch_source`。原来每个部件一个，而每个 timer 都是
                用 `dispatch_walltime(NULL, 0)` 各自起算、相位互不相同（leeway 又是
                10%），所以同一个 set 里那 N 次唤醒在时间上永远是散开的：4 个部件
                就是每周期 4 次主线程唤醒、4 轮「CoreText 排版 + 帧尺寸调整 + 遮罩
                重设」、CA 提交 4 次。合成一个之后是 1 次。顺带的好处是几个部件的
                取值落在**同一次**主线程 pass 上，下面那些缓存才真的被复用上。

              · `updateLabel` 只画**当前可见**的那一条渲染路径。每个部件同时有两条
                路径，`reloadUserDefaults` 保证任意时刻至多只有一条可见：开了自适应
                取色（默认）→ 可见的是 backdrop + maskLabel，`label` 是隐藏的；关了
                → 反过来。原来两条都写，于是每 tick 白付一份代价，而且是两份性质完全
                不同的代价 —— 写 `label` 会 invalidate 它的 intrinsicContentSize，
                `_contentView` 上那 ~6N 条约束要整轮重解一次 Auto Layout；写
                `maskLabel` 会换掉 `CABackdropLayer` 的遮罩（那层挂着 5 个 CAFilter：
                半径 50 的高斯模糊 + 亮度/对比度/饱和度/反相），遮罩一变就要重新合成。
                也就是说默认配置下，每个部件每 tick 都在**额外**触发一次完整的
                Auto Layout，画在一个没人看得见的 label 上。

              · CPU 温度不再在渲染路径上采样。`getCPUDieTemperature()` 的快速路径要
                枚举所有 AppleVendor 温度服务，每个服务两次 IOKit 往返
                （`CopyProperty` + `CopyEvent`），A11 上这类传感器有几十个 —— 这是一次
                **同步的内核枚举**，原来每个 tick 都在主线程上做一次。现在和 CPU
                频率同构：独立串行队列后台采样 + 缓存（1 s），formatter 只读缓存，
                渲染路径一次 IOKit 都不碰。开机后第一次仍同步取，免得部件刚出现时先
                闪一下「??ºC」。

              · 电池信息一个 tick 只取一次。设备温度、电池详情、电量百分比、充电符号
                四个部件要的是同一份 `IOPMPowerSource` 属性，原来各自调一次
                `getBatteryInfo()`（每次两次 IOKit 往返），一个 tick 里可能取四五遍。
                现在带 0.25 s 缓存。充电符号那张已染色的 SF Symbol 位图同理 ——
                `imageWithTintColor:` 是实打实的栅格化，原来每 tick 重做一次。

              · 频率探针改成**有人看才测**。探针是 2 个性能核各约 62 ms 的忙循环，
                而且线程 QoS 是 `QOS_CLASS_USER_INTERACTIVE`（不那样就上不了性能核、
                读不到顶档）—— 它会**抢占前台**。原来发布器每秒无条件 kick 一次，
                于是哪怕 HUD 上一个 CPU 频率部件都没有，每 5 秒也照样来一次双性能核
                饱和：在 2+4 的 A11 上，那就是肉眼可见的周期性掉帧，而且是 HUD 自己
                造成的。现在只在最近 10 秒内真的有人画过这个数时才 kick。共享文件的
                格式没变；没人看时 `freq_mhz` 写 0，SysProbe 读到 0 会回落到它自己的
                采样（那条降级路径本来就在）。

              · `NOTIFY_RELOAD_HUD` 去重。它被注册了两次（`notify_register_dispatch`
                一次、Darwin 通知中心一次），而 `notify_post` 两个都会投递 —— 于是
                每次改设置都把「读默认值 + 重排定时器 + 重建全部约束」整个跑两遍。
                加了一个 200 ms 的去重窗口，比赌哪条注册路径更可靠要稳。

            仍然没动的一处（留给用户决定）：

              · 频率探针的 5 秒节流没改。如果你**确实**在状态栏上放了 CPU 频率部件，
                那么每 5 秒一次、每次 62 ms 的双性能核饱和就是剩下最明显的一处卡顿，
                而且它是探针的原理决定的（要顶档就得把整个性能簇喂满）。三个选择：
                去掉频率部件（0.26 之后它就完全不跑）、把采样间隔调长、或者接受它。

            关于频率（承接 0.23）：

              · 频率是**探针实测值**（真实 IOReport 在本机不可用）。0.23 把单线程探针
                改成**两条线程**：本机是 2+4（2×Monsoon 性能核 + 4×Mistral），CLPC 要
                **整个性能簇都在忙**才给顶档 2376，只忙一个核时只给中间档（实测
                2030）。两条线程一起把簇喂满，才拿得到顶档。这也正是 CPU-X 读数又高
                又稳的原因 —— 它给每个核都挂了常驻自旋线程，我们只挂 2 条、且只在
                采样时跑。
              · 成本：每 5 秒一次，每次每线程 ~50 ms 预热 + ~12 ms 测量 = ~62 ms；
                两条并行，合计约占性能簇 2.5%。
              · 副作用（有意为之）：测量本身制造了性能簇负载，读数在采样时基本都靠近
                顶档，空闲时也一样。这和 CPU-X 的行为一致，原因也相同。每 5 秒一次，
                不是每帧一次，这个代价值得。
              · 若更想要「真实档位」而不是「能跑多快」，回退到 0.22 即可。

            安装：用 TrollStore / 巨魔安装 Statusbar.ipa。
            ⚠️ 装后**重启一次设备**，让 HUD 守护进程加载新二进制。

            使用：Statusbar → Customize → 添加部件。

            说明：
              · 若嫌卡，先看状态栏上有没有 CPU 频率部件 —— 有的话它就是最大的一处
                周期开销（见上）。
              · 自适应取色（Adaptive Color，默认开）本身不便宜，它每一帧都在重新采样
                HUD 背后的画面。三个降成本的旋钮：把「自适应模糊半径」调小（0 最省）、
                试一下「压缩滤镜」、或者干脆关掉它换成纯色文本（此时「文字描边」会
                保证文字在任何背景上都看得见）。
              · 温度正常是靠 HID 兜底（不是 IOReport）。

            基于 Helium（作者 LeminLimez，GPL-3.0）改版，本构建同样遵循 GPL-3.0。
          files: build/Statusbar.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
