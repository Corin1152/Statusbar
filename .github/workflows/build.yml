name: Build Helium (CPU Temperature)

# 触发方式：
#   1) push 到 main 自动构建
#   2) 在仓库 Actions 页面点 "Run workflow" 手动触发
#
# 注意：macos-13 镜像已于 2025-12-04 退役不可再用，这里用 macos-15（Apple Silicon）。
# 仓库根目录就是 Helium 源码树（Makefile/ipabuild.sh/src/layout 在此）。
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # 创建 Release 需要

    steps:
      - name: Show toolchain info
        run: |
          xcodebuild -version || true
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Arch: $(uname -m)"

      - name: Checkout patched Helium
        uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Set THEOS
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      # Helium 依赖 BackBoardServices / GraphicsServices / IOKit / SpringBoardServices
      # 四个私有框架，Xcode 自带 SDK 里没有，链接会报 "framework not found"。
      # 这里从 theos/sdks 只取这四个框架的 stub（.tbd，纯文本、与 Swift 无关），
      # 放进 private-frameworks/，再由 Makefile 的 -F 交给链接器。
      # 只稀疏检出这几个目录，不下载整个 SDK（否则数 GB，且旧 SDK 的 SwiftUI
      # 是 Swift 5.8 构建的，无法被 Xcode 16 的 Swift 6 使用）。
      - name: Fetch private framework stubs
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git sdk-stub
          cd sdk-stub
          git sparse-checkout set \
            iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/BackBoardServices.framework \
            iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/GraphicsServices.framework \
            iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/SpringBoardServices.framework \
            iPhoneOS16.5.sdk/System/Library/Frameworks/IOKit.framework
          cd ..
          mkdir -p private-frameworks
          cp -R sdk-stub/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/*.framework \
                private-frameworks/ 2>/dev/null || true
          cp -R sdk-stub/iPhoneOS16.5.sdk/System/Library/Frameworks/IOKit.framework \
                private-frameworks/ 2>/dev/null || true
          echo "---- private-frameworks 内容 ----"
          ls private-frameworks
          find private-frameworks -name "*.tbd" | sed 's/^/  /'

      # 用 Xcode 自带的 iOS SDK 编译（其 SwiftUI 与本机 Swift 版本匹配）。
      # Makefile 默认写死 16.5，与本机会话不一致会让 Theos 找不到 SDK，这里对齐。
      - name: Align SDK version in Makefile
        run: |
          HOST_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          TARGET_SDK="$(sed -n 's/^TARGET[[:space:]]*:=[^:]*:[^:]*:\([0-9.]*\):.*/\1/p' Makefile | head -1)"
          echo "本机 SDK = $HOST_SDK / Makefile SDK = $TARGET_SDK"
          if [ -n "$TARGET_SDK" ] && [ "$TARGET_SDK" != "$HOST_SDK" ]; then
            sed -i '' "s/^\(TARGET[[:space:]]*:=[^:]*:[^:]*:\)${TARGET_SDK}:/\1${HOST_SDK}:/" Makefile
            echo "已改写为: $(grep -m1 '^TARGET' Makefile)"
          else
            echo "版本一致，无需改动"
          fi

      - name: Install ldid
        run: brew install ldid

      # 用 `bash` 调用而不是 `./`：Git Data API 推送不保留可执行位，
      # `./ipabuild.sh` 会直接 Permission denied。仓库里那一位已经补回 100755，
      # 但调用方式不依赖它更稳。
      - name: Build tipa
        run: bash ipabuild.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statusbar.ipa
          path: build/Statusbar.ipa
          if-no-files-found: error

      # 发布到 Release：公开仓库的安装包可直接下载，无需登录、无鉴权。
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: statusbar-${{ github.run_number }}
          name: Statusbar 0.22 (build ${{ github.run_number }})
          body: |
            基于 Helium 改版。应用名改为 Statusbar，版本从 0.01 起（本次 0.22）。

            界面：只有「首页 / 自定义」两页，首页右上角直接显示版本号（无齿轮/设置入口）。
            部件：原有 9 个 + CPU温度 / CPU占用 / CPU频率 / 蜂窝信号（RSRP）。

            本次改动（把测量窗口切碎，高负载下读数才上得去）：
              · 0.21 换上 `cntpct_el0` 计时后，上限从 2000 抬到了 2200。
                但反馈说：**高负载（占用 80%+）时频率仍然只到 2030**。
              · 原因不在预热（高负载时时钟本来就在高位），在**测量窗口被抢占**。
                探针是用**墙钟时间**反推频率的：一轮 2.5 ms 里只要被打断，那段
                被打断的时间就全算进「耗时」，算出来的频率必然偏低。高负载时
                2.5 ms 的窗口很容易中招，而只有 6 轮 —— 抽不到一轮干净的就完了。
              · 本版把窗口切碎：单轮 2.5 ms → **0.5 ms**（200000 → 40000 次迭代），
                轮数 6 → **24**。总自旋时间不变（还是 12 ms），但「抓到一次干净
                测量」的机会从 6 次变成 24 次。每轮固定开销（两个 `isb` + 计数器
                读数，约两百个周期）在 0.5 ms 里占比仍低于 0.01%。
              · 参照：CPU-X 的单次探针窗口只有 ~100 μs（250,000 条指令），比我们
                原来的 2.5 ms 短 25 倍 —— 短窗口本来就是它读数高的原因之一。
                它每次刷新还跑 4 个探针 × 各 5 轮 = 20 次测量，本版是 24 次。

            另：**低负载常驻 1800 不是探针不准**，是 A11 在单核轻载时确实只给中间档
            （2376 要双性能核都在重载才给）。CPU-X 低负载也高，是因为它给**每个核**
            都挂了常驻自旋线程，把负载特征从「单核轻载」变成「全核重载」——
            它读的是「它自己制造负载后的频率」。状态栏部件不跟进这一条：
            那等于 24 小时烧电把数字撑好看。若仍希望跟上，可以再加「双核探针」。

            安装：用 TrollStore / 巨魔安装 Statusbar.ipa。
            ⚠️ 装后**重启一次设备**，让 HUD 守护进程加载新二进制。

            使用：Statusbar → Customize → 添加部件。

            说明：
              · 频率仍是「探针实测值」（真实 IOReport 本机不可用）；本版让它更接近峰值。
              · 若嫌卡，可把状态栏的 Update Interval 调大（如 2s）。
              · 温度正常是靠 HID 兜底（不是 IOReport）。

            基于 Helium（作者 LeminLimez，GPL-3.0）改版，本构建同样遵循 GPL-3.0。
          files: build/Statusbar.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
